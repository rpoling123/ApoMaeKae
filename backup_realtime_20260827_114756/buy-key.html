<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ซื้อ Key • ApoMaeKae V9.1</title><style>body{font-family:system-ui;margin:0;padding:18px;background:#071207}.w{max-width:720px;margin:auto}.c{background:white;border-radius:18px;padding:20px;margin:14px 0}.p{border:2px solid #ddd;border-radius:14px;padding:14px;margin:8px;display:inline-block}.on{border-color:#087f3e;background:#eafff0}.price{font-size:25px;font-weight:800;color:#087f3e}.b{width:100%;padding:13px;background:#087f3e;color:white;border:0;border-radius:10px;font-weight:700}.key{font-size:22px;font-weight:900;word-break:break-all;background:#eafff0;padding:12px}.qr{max-width:100%;max-height:420px}</style><div class=w><h1>🔑 APO MAEKAE V9.1 • ซื้อ Key</h1><div class=c><h2>เลือกแพ็กเกจ</h2><div class="p on" data-x=day onclick=s(this)>1 วัน<div class=price>฿5</div></div><div class=p data-x=week onclick=s(this)>7 วัน<div class=price>฿15</div></div><div class=p data-x=month onclick=s(this)>30 วัน<div class=price>฿39</div></div><div class=p data-x=year onclick=s(this)>365 วัน<div class=price>฿199</div></div><button class=b onclick=go()>สร้าง Order เพื่อชำระเงิน</button></div><div class=c id=pay style=display:none><h2>💳 ชำระเงิน</h2><p>Order: <b id=oid></b></p><p>ยอด: <b id=amt></b></p><p><b>📱 สแกน QR นี้เพื่อโอนชำระเงิน</b></p><img class=qr src=/payment_qr.svg><p class="small">หลังโอนแล้ว ระบบจะตรวจสอบรายการและสร้าง KEY ให้อัตโนมัติเมื่อพบยอดชำระ</p><div id=st>🟡 รอตรวจสอบ</div></div></div><script>let plan="day",id="";function s(x){document.querySelectorAll(".p").forEach(e=>e.classList.remove("on"));x.classList.add("on");plan=x.dataset.x}async function go(){let j=await fetch("/api/order/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan})}).then(r=>r.json());if(j.error)return alert(j.error);id=j.orderId;oid.textContent=id;amt.textContent="฿"+j.price;pay.style.display="block";poll()}async function poll(){let j=await fetch("/api/order/"+id).then(r=>r.json()).catch(()=>null);if(j&&j.status==="paid"){st.innerHTML="✅ ชำระเงินสำเร็จ<br>Key:<div class=key>"+j.key+"</div>หมดอายุ: <b>"+new Date(j.expiresAt).toLocaleString("th-TH",{timeZone:"Asia/Bangkok"})+"</b>";return}setTimeout(poll,5000)}</script>
