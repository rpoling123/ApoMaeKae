<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ซื้อ Key • APO MAEKAE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:#f3f8f5;
  color:#17231c;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.wrap{max-width:620px;margin:auto}
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 5px 20px #00000018
}
h1{
  margin:0 0 15px;
  padding:18px;
  border-radius:18px;
  background:#087f3e;
  color:#fff;
  text-align:center
}
h2{margin-top:0}
.packs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}
.p{
  border:2px solid #dce8e1;
  border-radius:14px;
  padding:15px 8px;
  text-align:center;
  cursor:pointer;
  font-weight:700
}
.p.on{
  border-color:#087f3e;
  background:#eaf8f0
}
.p small{
  display:block;
  color:#087f3e;
  font-size:20px;
  margin-top:5px
}
.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:#087f3e;
  color:#fff
}
.btn.blue{background:#1877f2}
.btn.gray{background:#e9eeeb;color:#17231c}
.btn:disabled{opacity:.5}
.qr{
  display:block;
  width:min(100%,360px);
  max-height:360px;
  object-fit:contain;
  margin:15px auto;
  border-radius:14px
}
.center{text-align:center}
.status{
  padding:14px;
  border-radius:12px;
  background:#f1f5f3;
  margin-top:12px;
  text-align:center
}
.key{
  background:#eaf8f0;
  border:2px dashed #087f3e;
  color:#087f3e;
  padding:16px;
  border-radius:12px;
  font-size:20px;
  font-weight:900;
  word-break:break-all;
  text-align:center
}
input[type=file]{
  width:100%;
  padding:12px;
  border:2px dashed #b8c8bf;
  border-radius:12px;
  background:#fafcfb
}
.preview{
  max-width:100%;
  max-height:300px;
  display:block;
  margin:12px auto;
  border-radius:12px
}
.small{font-size:13px;color:#68756d}
.hidden{display:none}
</style>
</head>

<body>
<div class="wrap">

<h1>🔑 APO MAEKAE<br>ซื้อ KEY</h1>

<div class="card">
<h2>1️⃣ เลือกแพ็กเกจ</h2>

<div class="packs">
  <div class="p on" data-x="day" onclick="selectPlan(this)">
    1 วัน
    <small>฿5</small>
  </div>

  <div class="p" data-x="week" onclick="selectPlan(this)">
    7 วัน
    <small>฿15</small>
  </div>

  <div class="p" data-x="month" onclick="selectPlan(this)">
    30 วัน
    <small>฿39</small>
  </div>
</div>

<button class="btn" onclick="createOrder()">
  ดำเนินการซื้อ KEY
</button>

<div id="orderBox" class="status hidden">
  Order ID: <b id="oid">-</b><br>
  จำนวนเงิน: <b id="amt">-</b>
</div>
</div>

<div id="paymentBox" class="card hidden">

<h2>2️⃣ ชำระเงิน</h2>

<div class="center">
  <b>สแกน QR เพื่อชำระเงิน</b>

  <img
    class="qr"
    src="/payment_qr.svg"
    alt="QR ชำระเงิน"
    onerror="this.onerror=null;this.src='/payment_qr.jpg'"
  >

  <div class="small">
    หลังโอนเงินแล้ว กดปุ่มตรวจสอบด้านล่าง
  </div>
</div>

<button class="btn" onclick="checkPayment()">
  🔎 ตรวจสอบการชำระ
</button>

<div id="status" class="status">
  🟡 รอตรวจสอบการชำระเงิน
</div>

</div>

<div id="successBox" class="card hidden">

<h2>3️⃣ ชำระเงินสำเร็จ</h2>

<div class="key" id="keyBox">-</div>

<p class="center">
หมดอายุ:
<b id="expires">-</b>
</p>

</div>

<div id="slipBox" class="card hidden">

<h2>4️⃣ แนบสลิป</h2>

<input
  id="slip"
  type="file"
  accept="image/*"
  onchange="previewSlip(this)"
>

<img id="preview" class="preview hidden">

<div class="small">
เลือกภาพสลิปจากเครื่อง แล้วกดปุ่มด้านล่าง
</div>

<button id="messengerBtn" class="btn blue" onclick="sendMessenger()" disabled>
  📩 ส่งสลิปเข้า Messenger
</button>

</div>

<div class="card">
<button class="btn gray" onclick="location.href='/'">
← กลับหน้าหลัก
</button>
</div>

</div>

<script>
let plan="day";
let orderId="";

function selectPlan(el){
  document.querySelectorAll(".p").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");
  plan=el.dataset.x;
}

async function createOrder(){
  try{
    const r=await fetch("/api/order/create",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({plan})
    });

    const j=await r.json();

    if(!r.ok){
      alert(j.error || "ไม่สามารถสร้าง Order ได้");
      return;
    }

    orderId=j.orderId;

    document.getElementById("oid").textContent=orderId;
    document.getElementById("amt").textContent="฿"+j.price;

    document.getElementById("orderBox").classList.remove("hidden");
    document.getElementById("paymentBox").classList.remove("hidden");

    window.scrollTo({
      top:document.getElementById("paymentBox").offsetTop-10,
      behavior:"smooth"
    });

  }catch(e){
    alert("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
  }
}

async function checkPayment(){
  if(!orderId){
    alert("กรุณาสร้าง Order ก่อน");
    return;
  }

  const st=document.getElementById("status");
  st.textContent="🔎 กำลังตรวจสอบ...";

  try{
    const r=await fetch(
      "/api/order/"+encodeURIComponent(orderId),
      {cache:"no-store"}
    );

    const j=await r.json();

    if(!r.ok){
      st.textContent="❌ ไม่พบ Order";
      return;
    }

    if(j.status==="paid" && j.key){

      st.innerHTML="✅ ชำระเงินสำเร็จ";

      document.getElementById("successBox").classList.remove("hidden");
      document.getElementById("slipBox").classList.remove("hidden");

      document.getElementById("keyBox").textContent=j.key;

      document.getElementById("expires").textContent=
        j.expiresAt
        ? new Date(j.expiresAt).toLocaleString(
            "th-TH",
            {timeZone:"Asia/Bangkok"}
          )
        : "-";

      window.scrollTo({
        top:document.getElementById("successBox").offsetTop-10,
        behavior:"smooth"
      });

    }else{

      st.innerHTML=
        "🟡 ยังไม่พบการชำระเงิน<br>"+
        "<span class='small'>หากโอนแล้ว กรุณารอสักครู่แล้วกดตรวจสอบอีกครั้ง</span>";

    }

  }catch(e){
    st.textContent="❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้";
  }
}

function previewSlip(input){

  const file=input.files && input.files[0];

  if(!file){
    document.getElementById("preview").classList.add("hidden");
    document.getElementById("messengerBtn").disabled=true;
    return;
  }

  const url=URL.createObjectURL(file);

  const img=document.getElementById("preview");
  img.src=url;
  img.classList.remove("hidden");

  document.getElementById("messengerBtn").disabled=false;
}

async function sendMessenger(){

  const input=document.getElementById("slip");

  if(!input.files || !input.files[0]){
    alert("กรุณาเลือกภาพสลิปก่อน");
    return;
  }

  const file=input.files[0];

  const message=
    "สลิปชำระ KEY APO MAEKAE\n"+
    "Order ID: "+orderId+"\n"+
    "กรุณาตรวจสอบและยืนยันการชำระเงิน";

  /*
   * Android/Chrome รองรับ Web Share ไฟล์ในหลายเครื่อง
   * ถ้าใช้ได้ จะเปิดเมนูแชร์และสามารถเลือก Messenger ได้
   */
  try{
    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){
      await navigator.share({
        title:"ส่งสลิป APO MAEKAE",
        text:message,
        files:[file]
      });
      return;
    }
  }catch(e){
    if(e && e.name==="AbortError") return;
  }

  /*
   * Fallback:
   * เปิด Messenger ห้องเป้าหมายโดยตรง
   */
  try{
    await navigator.clipboard.writeText(message);
  }catch(e){}

  window.location.href="https://m.me/rpolingkang1234";
}
</script>

</body>
</html>
