<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApoMaeKae - ซื้อ Key</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f8;margin:0;padding:20px;color:#222}
.card{max-width:520px;margin:auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 8px 30px #0002}
h1{text-align:center}label{display:block;font-weight:bold;margin:16px 0 8px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.upload{border:2px dashed #aaa;padding:18px;border-radius:14px;text-align:center}
#preview{display:none;width:100%;max-height:400px;object-fit:contain;margin-top:15px;border-radius:12px}
.btn{width:100%;padding:15px;border:0;border-radius:12px;margin-top:15px;font-size:17px;font-weight:bold}
.msg{background:#08f;color:#fff}.clear{background:#eee}
.status{background:#e8f5e9;padding:12px;border-radius:12px;text-align:center}
.note{font-size:13px;color:#666;line-height:1.6;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1>🔑 ซื้อ Key ApoMaeKae</h1>

<div class="status">🟢 ระบบพร้อมรับการชำระเงิน</div>

<label>👤 ชื่อ / Facebook</label>
<input id="name" placeholder="กรอกชื่อ">

<label>📧 อีเมล</label>
<input id="email" type="email" placeholder="กรอกอีเมล">

<label>📎 แนบสลิป</label>
<div class="upload">
เลือกภาพสลิป
<input id="slip" type="file" accept="image/jpeg,image/png,image/webp">
</div>

<img id="preview">

<button class="btn msg" onclick="send()">
💬 ส่งข้อมูลเข้า Messenger
</button>

<button class="btn clear" onclick="clearForm()">
ล้างข้อมูล
</button>

<div class="note">
หลังเปิด Messenger ให้แนบสลิปในแชทอีกครั้ง
เพราะเว็บไซต์ไม่สามารถแนบไฟล์เข้า Messenger
อัตโนมัติผ่าน m.me ได้
</div>
</div>

<script>
const s=document.getElementById('slip');
const p=document.getElementById('preview');

s.onchange=()=>{
 let f=s.files[0];
 if(!f){
   p.style.display='none';
   return;
 }
 if(!f.type.startsWith('image/')){
   alert('กรุณาเลือกไฟล์รูปภาพ');
   s.value='';
   return;
 }
 if(f.size>10*1024*1024){
   alert('ไฟล์ต้องไม่เกิน 10 MB');
   s.value='';
   return;
 }
 let r=new FileReader();
 r.onload=e=>{
   p.src=e.target.result;
   p.style.display='block';
 };
 r.readAsDataURL(f);
};

function send(){
 let n=document.getElementById('name').value.trim();
 let e=document.getElementById('email').value.trim();

 if(!n){
   alert('กรุณากรอกชื่อ');
   return;
 }

 if(!s.files[0]){
   alert('กรุณาเลือกสลิป');
   return;
 }

 let t=new Date().toLocaleString('th-TH');

 let m=
 '🔑 ขอซื้อ Key ApoMaeKae%0A'+
 '👤 ชื่อ: '+encodeURIComponent(n)+'%0A'+
 '📧 อีเมล: '+encodeURIComponent(e||'-')+'%0A'+
 '📎 มีสลิปพร้อมส่งในแชท%0A'+
 '⏰ เวลา: '+encodeURIComponent(t);

 location.href=
 'https://m.me/rpolingkang1234?text='+m;
}

function clearForm(){
 document.getElementById('name').value='';
 document.getElementById('email').value='';
 s.value='';
 p.src='';
 p.style.display='none';
}
</script>
</body>
</html>
