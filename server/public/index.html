<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApoMaeKae V9.1</title>
<style>body{font-family:system-ui;max-width:1050px;margin:auto;padding:18px;background:#071207;color:#18201b}.c{background:#fff;border-radius:16px;padding:18px;margin:14px 0}.hero{overflow:hidden;border-radius:16px}.hero img{width:100%;max-height:400px;object-fit:cover}.hero h1{margin:0;padding:12px;background:#16803d;color:#fff}.pill{padding:6px 10px;border-radius:20px;background:#e8f7ed;color:#087f3e;font-weight:700}button,input{padding:10px;margin:4px;border-radius:9px;border:1px solid #ccd}button{cursor:pointer}.primary{background:#16803d;color:#fff}.bad{color:#b91c1c}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style>
<div class=hero><img src="/apomaekae_bg.jpg"><h1>อาโป แมพเก๊ • V9.1 • Zone Guard 500m</h1></div>
<div class=c><h2>🔊 เสียงการแจ้งเตือน</h2><button onclick="sound()">🔔 เปิด/ปิดเสียง</button> <button onclick="test()">▶️ ทดสอบเสียง</button><p>เข้าโซนจะแจ้งครั้งเดียว และจะรีเซ็ตเมื่อออกจากโซน</p></div>
<div class=c><h2>🔑 KEY</h2><div id=status><span class=pill>🟢 ออนไลน์</span></div><p>วัน/เวลาหมดอายุ: <b id=exp>-</b></p><p>ตรวจสอบล่าสุด: <b id=seen>-</b></p></div>
<div class=c><h2>🛠️ License Admin V9.1</h2><input id=token placeholder="Admin Token" type=password><button onclick=load()>โหลดรายการ</button><span id=health></span><h3>สร้าง License</h3><input id=start type=datetime-local><input id=end type=datetime-local><input id=max type=number value=1 min=1 style="width:70px"><button class=primary onclick=createKey()>สร้าง Key</button><div id=created></div><h3>รายการ License</h3><div style="overflow:auto"><table><thead><tr><th>Key</th><th>เริ่ม</th><th>หมดอายุ</th><th>สถานะ</th></tr></thead><tbody id=rows></tbody></table></div></div>
<script>
let on=true,ctx;
function fmt(x){return x?new Date(x).toLocaleString("th-TH",{timeZone:"Asia/Bangkok"}):"-"}
function sound(){on=!on;alert(on?"เปิดเสียงแล้ว":"ปิดเสียงแล้ว")}
function test(){if(!on)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext);let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25)}
async function health(){try{let x=await fetch("/api/health").then(r=>r.json());health.innerHTML=" <span class=pill>🟢 ออนไลน์ V9.1</span>";seen.textContent=fmt(x.serverTime)}catch(e){health.innerHTML=" <span class=bad>🔴 ออฟไลน์</span>"}}
async function load(){await health();let r=await fetch("/api/admin/keys",{headers:{"x-admin-token":token.value}});if(!r.ok)return alert("Admin Token ไม่ถูกต้อง");let x=await r.json();rows.innerHTML=Object.values(x).map(k=>"<tr><td><b>"+k.key+"</b></td><td>"+fmt(k.startAt)+"</td><td>"+fmt(k.expiresAt)+"</td><td>"+(k.revoked?"🔴 ระงับ":Date.now()<Date.parse(k.expiresAt)?"🟢 ACTIVE":"⚪ หมดอายุ")+"</td></tr>").join("")}
async function createKey(){let r=await fetch("/api/admin/keys",{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":token.value},body:JSON.stringify({startDate:new Date(start.value).toISOString(),expiresDate:new Date(end.value).toISOString(),maxDevices:Number(max.value)})}),j=await r.json();if(!r.ok)return alert(j.error);created.innerHTML="<p>สร้างสำเร็จ: <b>"+j.key+"</b></p>";load()}
health();setInterval(health,30000);
</script>
