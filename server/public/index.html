<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApoMaeKae License Admin</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding:20px;background:#f5f7f8;color:#172026}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0001}input,button{padding:10px 12px;margin:4px;border-radius:9px;border:1px solid #ccd3d8}button{cursor:pointer;font-weight:600}.primary{background:#15803d;color:#fff;border-color:#15803d}.danger{background:#b91c1c;color:#fff;border-color:#b91c1c}.muted{color:#667}.ok{color:#15803d}.bad{color:#b91c1c}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left;vertical-align:top}.key{font-family:monospace;font-weight:700}.actions button{font-size:12px}#msg{white-space:pre-wrap}</style></head><body>
<div class="card"><h2>🔑 ApoMaeKae License Admin V8.3</h2><div class="muted">สร้าง / ตรวจ / ระงับ / ปลดระงับ / ล้างเครื่องของ License Key</div><input id="token" placeholder="Admin Token" type="password" style="width:280px"><button onclick="load()">🔄 โหลดรายการ</button><span id="health"></span></div>
<div class="card"><h3>➕ สร้าง License</h3><label>เริ่มใช้งาน <input id="start" type="datetime-local"></label><label>หมดอายุ <input id="end" type="datetime-local"></label><label>จำนวนเครื่อง <input id="max" type="number" value="1" min="1" max="10000" style="width:80px"></label><button class="primary" onclick="createKey()">สร้าง Key</button><div id="created"></div></div>
<div class="card"><h3>📋 รายการ License</h3><div id="msg" class="muted"></div><div style="overflow:auto"><table><thead><tr><th>Key</th><th>เริ่ม</th><th>หมดอายุ</th><th>เครื่อง</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const $=id=>document.getElementById(id); const headers=()=>({'Content-Type':'application/json','x-admin-token':$('token').value});
function fmt(x){return x?new Date(x).toLocaleString('th-TH'): '-'}
async function api(url,opt={}){let r=await fetch(url,opt);let j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw new Error(j.error||j.message||('HTTP '+r.status));return j}
async function health(){try{let x=await api('/api/health');$('health').textContent=' 🟢 Server '+fmt(x.serverTime)}catch(e){$('health').textContent=' 🔴 Server offline'}}
async function createKey(){try{let s=$('start').value,e=$('end').value;if(!s||!e)throw new Error('กรุณาเลือกวันเริ่มและวันหมดอายุ');let x=await api('/api/admin/keys',{method:'POST',headers:headers(),body:JSON.stringify({startDate:new Date(s).toISOString(),expiresDate:new Date(e).toISOString(),maxDevices:Number($('max').value)})});$('created').innerHTML='<p class="ok">สร้างสำเร็จ: <span class="key">'+x.key+'</span> <button onclick="navigator.clipboard.writeText(\''+x.key+'\')">คัดลอก</button></p>';load()}catch(e){alert(e.message)}}
async function action(path,key){try{await api(path,{method:'POST',headers:headers(),body:JSON.stringify({key})});load()}catch(e){alert(e.message)}}
async function load(){try{await health();let x=await api('/api/admin/keys',{headers:headers()});let arr=Object.values(x);$('rows').innerHTML=arr.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(k=>{let active=!k.revoked&&Date.now()>=new Date(k.startAt).getTime()&&Date.now()<new Date(k.expiresAt).getTime();let st=k.revoked?'🔴 REVOKED':active?'🟢 ACTIVE':'⚪ EXPIRED/WAIT';let btn=k.revoked?'<button onclick="action(\'/api/admin/unrevoke\',\''+k.key+'\')">ปลดระงับ</button>':'<button class="danger" onclick="action(\'/api/admin/revoke\',\''+k.key+'\')">ระงับ</button>';return '<tr><td class="key">'+k.key+'<br><button onclick="navigator.clipboard.writeText(\''+k.key+'\')">คัดลอก</button></td><td>'+fmt(k.startAt)+'</td><td>'+fmt(k.expiresAt)+'</td><td>'+((k.devices||[]).length)+' / '+k.maxDevices+'<br><small>'+((k.devices||[]).map(d=>d.slice(0,10)).join(', ')||'-')+'</small></td><td>'+st+'</td><td class="actions">'+btn+'<button onclick="action(\'/api/admin/reset-devices\',\''+k.key+'\')">ล้างเครื่อง</button></td></tr>'}).join('');$('msg').textContent=arr.length+' Key';}catch(e){$('msg').textContent='🔴 '+e.message}}
health();
</script></body></html>
